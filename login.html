<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acceso al Sistema - SAEP</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background-color: #2c3e50;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .login-box {
        background: white;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 350px;
        text-align: center;
        border-top: 6px solid #0088cc;
      }
      .login-box h2 {
        margin: 0 0 10px;
        color: #2c3e50;
      }
      .login-box p {
        color: #7f8c8d;
        font-size: 14px;
        margin-bottom: 25px;
      }
      .input-group {
        margin-bottom: 15px;
        text-align: left;
      }
      .input-group label {
        display: block;
        font-size: 12px;
        font-weight: bold;
        color: #333;
        margin-bottom: 5px;
      }
      .input-group input {
        width: 100%;
        padding: 10px;
        font-size: 14px;
        border: 1px solid #ddd;
        border-radius: 5px;
        box-sizing: border-box;
        outline: none;
        transition: border 0.3s;
      }
      .input-group input:focus {
        border-color: #0088cc;
      }
      .btn-login {
        background-color: #0088cc;
        color: white;
        border: none;
        width: 100%;
        padding: 12px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.3s;
        margin-top: 10px;
      }
      .btn-login:hover {
        background-color: #006699;
      }
      .error-msg {
        color: #e74c3c;
        font-size: 13px;
        margin-top: 15px;
        display: none;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <h2>SAEP</h2>
      <p>Sistema de Apoyo Electoral Parlamentario</p>

      <div class="input-group">
        <label>USUARIO</label>
        <input type="text" id="user" placeholder="Ingrese su usuario" />
      </div>
      <div class="input-group">
        <label>CONTRASEÑA</label>
        <input type="password" id="pass" placeholder="Ingrese su contraseña" />
      </div>

      <button class="btn-login" id="btn-ingresar">Ingresar al Sistema</button>
      <div class="error-msg" id="msg-error">Credenciales incorrectas.</div>
    </div>

    <script>
      document
        .getElementById("btn-ingresar")
        .addEventListener("click", async () => {
          const user = document.getElementById("user").value;
          const pass = document.getElementById("pass").value;
          const btn = document.getElementById("btn-ingresar");
          const errorMsg = document.getElementById("msg-error");

          if (!user || !pass) return;

          btn.innerText = "Verificando...";
          btn.disabled = true;
          errorMsg.style.display = "none";

          try {
            // Llamamos a nuestra API segura en Vercel
            const response = await fetch("/api/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ usuario: user, password: pass }),
            });

            const data = await response.json();

            if (data.success) {
              // Guardamos el token simulado para saber que ya entró
              sessionStorage.setItem("saep_token", data.token);
              // Redirigimos al mapa principal
              window.location.href = "index.html";
            } else {
              errorMsg.innerText = data.message;
              errorMsg.style.display = "block";
            }
          } catch (error) {
            errorMsg.innerText = "Error de conexión con el servidor.";
            errorMsg.style.display = "block";
          } finally {
            btn.innerText = "Ingresar al Sistema";
            btn.disabled = false;
          }
        });
    </script>
  </body>
</html>
